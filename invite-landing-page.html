<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Join garden — My PlantKeeper</title>
  <style>
    :root {
      --primary: #146ef5;
      --text: #080808;
      --textSec: #5a5a5a;
      --bg: #f7f7f7;
      --surface: #ffffff;
      --border: #d8d8d8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%;
      background: var(--surface); border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      padding: 32px 28px; text-align: center;
    }
    .logo {
      width: 64px; height: 64px; border-radius: 18px;
      background: var(--primary); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 32px; margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(20,110,245,0.25);
    }
    h1 { font-size: 24px; margin: 8px 0 6px; letter-spacing: -0.5px; }
    p  { font-size: 15px; color: var(--textSec); line-height: 1.5; margin: 0 0 20px; }
    .btn {
      display: block; width: 100%;
      background: var(--primary); color: #fff;
      font-size: 16px; font-weight: 700; letter-spacing: 0.2px;
      padding: 16px; border-radius: 999px;
      border: 0; cursor: pointer; text-decoration: none;
      margin-bottom: 10px;
      box-shadow: 0 6px 16px rgba(20,110,245,0.18);
    }
    .btn:active { transform: translateY(1px); }
    .secondary {
      background: transparent; color: var(--primary); border: 1.5px solid var(--primary);
      box-shadow: none;
    }
    .hint { font-size: 12px; color: var(--textSec); margin-top: 14px; }
    .error {
      background: #ffe9ec; color: #c01934;
      padding: 12px; border-radius: 12px; font-size: 13px; margin-top: 12px;
      display: none;
    }
    .error.visible { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🌿</div>
    <h1>You're invited!</h1>
    <p>Join a shared plant garden on My PlantKeeper. You'll see the same plants and get the same care reminders.</p>

    <button id="openApp" class="btn">Open in My PlantKeeper</button>
    <a id="appStore" class="btn secondary" href="https://apps.apple.com/app/id6762401363">Get the app</a>

    <p class="hint">If you don't have the app, install it first, sign in, then tap this link again.</p>

    <div id="noToken" class="error">No invitation token found in this link.</div>
  </main>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');

      if (!token) {
        document.getElementById('noToken').classList.add('visible');
        document.getElementById('openApp').style.display = 'none';
        return;
      }

      var deepLink = 'plantkeeper://invite?token=' + encodeURIComponent(token);

      function openApp() {
        // Trigger the custom-scheme URL. iOS will show "Open in My PlantKeeper?"
        window.location.href = deepLink;
      }

      // Auto-attempt once on load (some browsers block this if not user-initiated).
      setTimeout(openApp, 150);

      document.getElementById('openApp').addEventListener('click', function(e) {
        e.preventDefault();
        openApp();
      });
    })();
  </script>
</body>
</html>
